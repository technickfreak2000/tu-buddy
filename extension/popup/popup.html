<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TU Auto Login</title><link rel="stylesheet" href="popup.css"><script src="popup.js" defer></script></head>
<body>
  <header><img src="../icons/tu.svg" width="32" height="32" alt=""><strong>TU Auto Login</strong><span id="state">…</span></header>
  <p id="detail" role="status">Checking automatic login…</p>
  <p id="credentials"></p>
  <button id="toggle" type="button" disabled>Loading…</button>
  <button id="settings" class="secondary" type="button">Account &amp; OTP settings</button>
  <button id="find-guest" class="secondary" type="button">Find TUB-Guest login</button>
  <p class="footnote">Logging out pauses automatic login until you resume it here.</p>
</body>
</html>
